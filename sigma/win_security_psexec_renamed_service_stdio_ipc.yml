title: Remote PsExec-Style Stdio Pipe With Renamed Service On IPC$
id: dfa1e2a9-0322-467c-b9cd-1500214ad399
name: cw_psexec_renamed_service_stdio_ipc
related:
    - id: c462f537-a1e3-41a6-b5fc-b2c2cef9bf82 # SigmaHQ: Suspicious PsExec Execution
      type: derived
status: experimental
description: |
    Detects a remote client opening a PsExec-style stdio pipe
    (<service>-<client host>-<client pid>-stdin|stdout|stderr) on IPC$ whose service segment
    is not the default PSEXESVC, i.e. PsExec run with a renamed service (psexec -r) or a clone
    that reuses the naming scheme. Derived from SigmaHQ c462f537 with two changes: the whole
    name must have the stdio shape (a numeric pid segment before the stream, not just a
    "-stdin" suffix), and loopback clients are excluded so the rule only reports pipe opens
    that came from another machine. RelativeTargetName carries the client's host name, and
    IpAddress its address.
references:
    - https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
    - https://github.com/SigmaHQ/sigma/blob/8a4813404ea3074890e0cda9272d4d1a8b2941d6/rules/windows/builtin/security/win_security_susp_psexec.yml
    - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES/blob/4ceed2f4706daf601c212a8f91c113dd85349a2c/Lateral%20Movement/LM_renamed_psexecsvc_5145.evtx
    - https://github.com/IlkerUnver00/crabwalk/blob/4a37de8ce96658d255a4b50be6d692da3a73935d/src/crabwalk/rules/pipes.py
author: Ilker Unver
date: 2026-10-08
tags:
    - attack.lateral-movement
    - attack.t1021.002
    - attack.execution
    - attack.t1569.002
logsource:
    product: windows
    service: security
    definition: 'Requires the advanced audit policy "Object Access > Audit Detailed File Share" (Success).'
detection:
    selection:
        EventID: 5145
        ShareName|endswith: '\IPC$'
        RelativeTargetName|re|i: '^[^-\\]+-.+-[0-9]+-std(?:in|out|err)$'
    filter_main_default_service:
        RelativeTargetName|startswith: 'PSEXESVC-'
    filter_main_loopback:
        - IpAddress|startswith:
              - '127.'
              - '::ffff:127.'
        - IpAddress: '::1'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Administrators or deployment tooling that run PsExec with -r against remote hosts
    - Other software that names its own pipes <name>-<host>-<number>-stdin|stdout|stderr
level: high
