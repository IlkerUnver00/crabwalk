title: Executable Written To ADMIN$ Or C$ Over SMB
id: 760b734a-d59f-4b76-95c8-aa87763e59ec
name: cw_admin_share_executable_write
status: experimental
description: |
    Building block for the correlation below: a client opens an executable on the ADMIN$ or
    C$ share with write access. This is how PsExec and its clones copy their service binary
    to the target before installing it. On its own it is common admin and deployment
    traffic, so it is meant to be correlated, not alerted on.
references:
    - https://github.com/IlkerUnver00/crabwalk/blob/4a37de8ce96658d255a4b50be6d692da3a73935d/src/crabwalk/rules/pipes.py
author: Ilker Unver
date: 2026-10-08
tags:
    - attack.lateral-movement
    - attack.t1570
    - attack.t1021.002
logsource:
    product: windows
    service: security
    definition: 'Requires the advanced audit policy "Object Access > Audit Detailed File Share" (Success).'
detection:
    selection:
        EventID: 5145
        ShareName|endswith:
            - '\ADMIN$'
            - '\C$'
        RelativeTargetName|endswith:
            - '.exe'
            - '.dll'
            - '.bat'
            - '.cmd'
            - '.ps1'
            - '.scr'
        AccessList|contains:
            - '%%4417'     # WriteData, as stored in the raw event
            - 'WriteData'  # the same right as rendered by most collectors
    condition: selection
falsepositives:
    - Software deployment, patching and admin scripts that copy binaries to admin shares
level: low
---
title: Admin Share Executable Drop And Renamed PsExec Stdio Pipe From The Same Client
id: 535e67b3-cbd6-4626-bee9-00a09470d1a1
status: experimental
description: |
    The same client address writes an executable to ADMIN$ or C$ on a host and opens
    PsExec-style stdio pipes with a non-default service name on that host's IPC$, within five
    minutes of each other: the copy-and-run pair of a renamed PsExec. The order is not
    enforced (temporal, not temporal_ordered, because the Splunk backend does not support
    temporal_ordered). Grouping by Computer and IpAddress keeps two clients working the same
    host apart. Both events come from Security 5145; Sysmon pipe events carry no client
    address and cannot be grouped this way.
references:
    - https://github.com/IlkerUnver00/crabwalk/blob/4a37de8ce96658d255a4b50be6d692da3a73935d/src/crabwalk/rules/pipes.py
    - https://github.com/SigmaHQ/sigma-specification/blob/ba9251aa834b11a70dbf80836b453dba99c5159e/specification/sigma-correlation-rules-specification.md
author: Ilker Unver
date: 2026-10-08
tags:
    - attack.lateral-movement
    - attack.t1021.002
    - attack.t1570
    - attack.execution
    - attack.t1569.002
correlation:
    type: temporal
    rules:
        - cw_admin_share_executable_write
        - cw_psexec_renamed_service_stdio_ipc
    group-by:
        - Computer
        - IpAddress
    timespan: 5m
    # pySigma 1.5.1 reads generate here; spec 2.1.0 puts it at the top level.
    generate: true
falsepositives:
    - Administrators deploying a binary and then running it with PsExec -r from the same workstation
level: critical
